name: umodzi
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get: ^4.6.6
  dio: ^5.7.0
  pretty_dio_logger: ^1.4.0
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.2.3
  google_fonts: ^8.1.0
