  cached_network_image: ^3.4.1
  intl_phone_field: ^3.2.0
  image_picker: ^1.2.2
  file_picker: ^8.1.7
  pin_code_fields: ^9.3.0
  intl: ^0.20.2
  flutter_html: ^3.0.0
  flutter_dotenv: ^6.0.0
  dio_cookie_manager: ^3.3.0
  cookie_jar: ^4.0.8
